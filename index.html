
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Super English Learning Centre</title>
    <link rel="icon" type="image/png" href="https://cdn.discordapp.com/attachments/643815263648612359/1468159399641219134/pfp_4.png?ex=6983aa3d&is=698258bd&hm=5650ef98f08bc066418b649593f3d5889506666b3ed10a8c7b762abf7d4b6690&">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .animate-shimmer {
        animation: shimmer 3s infinite linear;
      }

      /* Manual support for tailwindcss-animate plugin classes */
      .animate-in {
        animation-duration: 300ms;
        animation-fill-mode: both;
      }
      .fade-in {
        animation-name: fadeIn;
      }
      .zoom-in {
        animation-name: zoomIn;
      }
      .slide-in-from-right {
        animation-name: slideInFromRight;
      }
      .slide-in-from-top-4 {
        animation-name: slideInFromTop;
      }
      .slide-in-from-right-4 {
        animation-name: slideInFromRightOffset;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes zoomIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes slideInFromRight {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      @keyframes slideInFromTop {
        from { transform: translateY(-1rem); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes slideInFromRightOffset {
        from { transform: translateX(1rem); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }

      .duration-500 { animation-duration: 500ms; }
      .duration-300 { animation-duration: 300ms; }
      .duration-200 { animation-duration: 200ms; }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
